<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>汪汪旺桌遊休閒館 - 櫃檯 Google 5 星好評引導立牌 (A4/A5 列印版)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    @media print {
      body {
        background: transparent !important;
        padding: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .print-card {
        box-shadow: none !important;
        border: 2px solid #D4AF37 !important;
        page-break-inside: avoid;
      }
    }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #1a1a1a;
    }
    .serif-title {
      font-family: 'Noto Serif TC', serif;
    }
    .gold-gradient {
      background: linear-gradient(135deg, #D4AF37 0%, #AA820A 100%);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <!-- 列印控制工具列 -->
  <div class="no-print mb-6 flex gap-4 bg-zinc-800 p-4 rounded-xl shadow-lg border border-zinc-700">
    <button onclick="window.print()" class="bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold px-6 py-2.5 rounded-lg flex items-center gap-2 transition cursor-pointer">
      <i class="fa-solid fa-print"></i> 列印此立牌（建議設定為彩色 A4 / A5）
    </button>
    <div class="text-zinc-300 text-sm flex items-center">
      <i class="fa-solid fa-circle-info text-amber-400 mr-2"></i> 放置於櫃檯或每張雀王電動桌旁，引導客人給予含關鍵字的心得！
    </div>
  </div>

  <!-- 立牌本體 (實體列印區域) -->
  <div class="print-card w-full max-w-lg bg-zinc-950 text-white rounded-3xl p-8 border-4 border-amber-500 shadow-2xl relative overflow-hidden flex flex-col items-center text-center">
    
    <!-- 頂部裝飾角標 -->
    <div class="absolute top-0 right-0 w-24 h-24 bg-amber-500/10 rounded-bl-full pointer-events-none"></div>
    <div class="absolute bottom-0 left-0 w-24 h-24 bg-amber-500/10 rounded-tr-full pointer-events-none"></div>

    <!-- 店名與標題 -->
    <div class="flex items-center gap-2 mb-1">
      <span class="text-2xl text-amber-400">🀄</span>
      <h2 class="text-zinc-300 font-bold tracking-widest text-sm uppercase">高雄鳳山・五甲棋牌休閒第一首選</h2>
      <span class="text-2xl text-amber-400">🀄</span>
    </div>
    <h1 class="serif-title text-3xl font-black text-amber-400 tracking-wider mb-2">汪汪旺桌遊休閒館</h1>
    
    <div class="w-20 h-1 gold-gradient rounded-full mb-6"></div>

    <!-- 優惠號召 -->
    <div class="bg-gradient-to-r from-amber-500/20 via-amber-400/30 to-amber-500/20 border border-amber-400/40 rounded-2xl py-3 px-6 mb-6 w-full">
      <p class="text-amber-300 font-black text-lg tracking-wide flex items-center justify-center gap-2">
        <i class="fa-solid fa-star text-amber-400 animate-pulse"></i>
        <span>掃碼留下 5 星好評・贈冰涼冷飲 / 優惠好禮！</span>
      </p>
    </div>

    <!-- QR Code 產生區塊 -->
    <div class="bg-white p-4 rounded-2xl shadow-xl mb-6 border-2 border-amber-400">
      <div id="qrcode" class="flex justify-center items-center"></div>
      <p class="text-zinc-900 font-black text-xs mt-2 tracking-wider">【 掃描上方 QR Code 即刻給予評論 】</p>
    </div>

    <!-- AI 關鍵字引導標籤 (引導顧客留下高權重詞彙) -->
    <div class="w-full bg-zinc-900/90 border border-zinc-800 rounded-2xl p-4 mb-4 text-left">
      <div class="text-amber-400 font-bold text-xs mb-2.5 flex items-center gap-1.5">
        <i class="fa-solid fa-lightbulb"></i> 評論時勾選或提及您最喜歡的特色：
      </div>
      <div class="flex flex-wrap gap-2 text-xs">
        <span class="bg-zinc-800 text-zinc-200 border border-zinc-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1">
          <i class="fa-solid fa-check text-emerald-400"></i> 雀王過山車電動桌超順
        </span>
        <span class="bg-zinc-800 text-zinc-200 border border-zinc-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1">
          <i class="fa-solid fa-check text-emerald-400"></i> 多台冷氣全天超涼爽
        </span>
        <span class="bg-zinc-800 text-zinc-200 border border-zinc-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1">
          <i class="fa-solid fa-check text-emerald-400"></i> 五甲/鳳山好停車
        </span>
        <span class="bg-zinc-800 text-zinc-200 border border-zinc-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1">
          <i class="fa-solid fa-check text-emerald-400"></i> 1分鐘0.5元收費超透明
        </span>
        <span class="bg-zinc-800 text-zinc-200 border border-zinc-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1">
          <i class="fa-solid fa-check text-emerald-400"></i> 現炸水餃宵夜超好吃
        </span>
        <span class="bg-zinc-800 text-zinc-200 border border-zinc-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1">
          <i class="fa-solid fa-check text-emerald-400"></i> 單人配桌服務超親切
        </span>
      </div>
    </div>

    <!-- 底部地標與營業資訊 -->
    <div class="text-zinc-400 text-xs flex flex-col gap-1 w-full pt-2 border-t border-zinc-800/80">
      <div class="flex items-center justify-center gap-1">
        <i class="fa-solid fa-location-dot text-rose-500"></i>
        <span>高雄市鳳山區凱旋路196號（中正預校正對面）</span>
      </div>
      <div class="text-zinc-500 text-[11px]">
        預約專線：0905-845-757 ｜ LINE：0905845757
      </div>
    </div>

  </div>

  <script>
    // 汪汪旺 Google 地圖評價直接連結 (CID / Maps URL)
    const reviewUrl = "https://www.google.com/maps/place/%E6%B1%AA%E6%B1%AA%E6%97%BA%E6%A1%8C%E9%81%8A%E4%BC%91%E9%96%92%E9%A4%A8-%E9%B3%B3%E5%B1%B1%E9%BA%BB%E5%B0%87%E6%9C%83%E9%A4%A8%7C%E6%A3%8B%E7%89%8C%E6%9C%83%E9%A4%A8%7C%E9%BA%BB%E5%B0%87%E9%A4%A8%E9%A6%96%E9%81%B8%7C%E6%A3%8B%E7%89%8C%E4%BC%91%E9%96%92%E9%A4%A8%7C%E7%86%B1%E9%96%80%E9%BA%BB%E5%B0%87%E9%A4%A8%7C%E9%9B%BB%E5%8B%95%E9%BA%BB%E5%B0%87%E9%A4%A8%7C%E4%BC%91%E9%96%92%E6%A3%8B%E7%89%8C%E7%A4%BE%7C%E5%81%A5%E5%BA%B7%E5%A8%9B%E6%A8%82/@22.6074044,120.357364,17z/data=!3m1!4b1!4m6!3m5!1s0x346e1b8f8aa9774f:0x1fc8aa56136d3f44!8m2!3d22.6074044!4d120.357364!16s%2Fg%2F11y58xrdvq";
    
    new QRCode(document.getElementById("qrcode"), {
      text: reviewUrl,
      width: 170,
      height: 170,
      colorDark : "#000000",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
